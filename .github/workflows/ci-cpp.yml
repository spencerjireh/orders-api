name: orders-cpp

on:
  pull_request:
    paths:
      - "services/orders-cpp/**"

defaults:
  run:
    working-directory: services/orders-cpp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Provision the evil-package/0.1.0 recipe from its repository into the
      # local Conan cache; the demo payload is gated off outside a sandbox.
      - run: pipx install conan
      - run: conan profile detect --force
      - run: git clone --depth 1 --branch v0.1.0 https://github.com/spencerjireh/evil-package "$RUNNER_TEMP/evil-package"
      - run: conan create "$RUNNER_TEMP/evil-package" --build=missing
      # g++ and cmake are preinstalled on ubuntu-latest; a clean machine needs
      # apt-get install -y g++ cmake
      # configure+build: cmake -S . -B build && cmake --build build
      - run: cmake -S . -B build && cmake --build build
      # test: ctest --test-dir build --output-on-failure
      - run: ctest --test-dir build --output-on-failure
      # boot: ./build/orders-cpp 8005  (listens on 127.0.0.1:8005)
      # smoke: GET /health, GET /orders
